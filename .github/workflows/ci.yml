name: CI

# Static checks only: no secrets, no Snowflake connection, no credits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.17.4"

      - name: Lint (ruff, config in ruff.toml)
        run: ruff check .

      - name: Validate generator configuration
        run: python -c "import sys; sys.path.insert(0, 'data-generator'); import config; config.load_config(); print('config.yaml OK')"

      - name: Validate docker-compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: dbt parse (project structure, refs, tests — no warehouse connection)
        working-directory: banking_dbt
        env:
          # dummy values: dbt parse renders the profile but never connects
          SNOWFLAKE_ACCOUNT: ci-dummy
          SNOWFLAKE_USER: ci-dummy
          SNOWFLAKE_PASSWORD: ci-dummy
          SNOWFLAKE_WAREHOUSE: ci-dummy
          SNOWFLAKE_DB: BANKING
        run: dbt parse --profiles-dir .dbt --warn-error
